    const GUA_DATA = [
      { id:1, name:"乾", symbol:"䷀", upper:"乾", lower:"乾",
        judgment:"元亨，利贞。",
        detail:{
          plain:"乾卦六爻皆阳，象征纯粹的刚健与创造之力。天道运行不息，君子观此象，当效法天的刚健，不断奋发进取。卦辞“元亨利贞”四字，对应“始、通、和、正”四种德性：万物由此开始，由此亨通，由此和谐，由此贞定。乾卦的核心不是蛮力向前，而是在不同时位中知进退——潜、见、惕、跃、飞、亢，各有其道。",
          career:"大吉之象，能力与时机俱佳时，事业可以如日中天。但关键在于“时位”：初期宜潜蓄，中期宜勤勉警惕，鼎盛时更要防止“亢龙有悔”，不可自满冒进。适合承担开创性、领导性的角色。",
          fortune:"运势处于上升与旺盛阶段，地位与名望有提升空间。但乾卦纯阳，盛极易衰，凡事以谦和节制为贵，避免因刚强过度而折损。",
          family:"阳刚过盛，家庭中容易以自我为中心。需主动以柔济刚，多沟通、多迁就，不可逞强争胜。感情中双方若能刚柔互补，则可长久；若各执一端，矛盾会反复出现。"
        }
      },
      { id:2, name:"坤", symbol:"䷁", upper:"坤", lower:"坤",
        judgment:"元亨，利牝马之贞。君子有攸往，先迷后得主，利西南得朋，东北丧朋。安贞，吉。",
        detail:{
          plain:"坤卦六爻皆阴，象征大地的柔顺、包容与承载。坤的“亨”不同于乾的直接开创，而是通过顺应天道、厚德载物来实现。“利牝马之贞”以母马的柔顺而能行远为喻：柔不是软弱，而是以持久的耐力走完长途。“先迷后得主”提示：不争先、不主导，反而能在跟随中找到自己的位置。“西南得朋，东北丧朋”讲的是合群与独立之间的取舍——在适合自己的方向上获得同类，在不适合的方向上失去同类也未必是坏事。安于正道，自然吉祥。",
          career:"适合辅佐、协作、执行与支持型的角色。不宜独断专行或冒险急进，获得团队与伙伴的支持则吉。坤道的事业路径是“以静制动、以柔克刚”，在稳定中积累实力。",
          fortune:"运势不宜急进。此时退守幕后、含蓄温和，比强出头更有利。保持耐心与恒心，等待时机自然成熟。",
          family:"家庭中强调包容与承载。进展可能缓慢，但欲速则不达。柔顺、耐心、以家庭整体为重，是坤卦在亲密关系中的核心智慧。"
        }
      },
      { id:3, name:"屯", symbol:"䷂", upper:"坎", lower:"震",
        judgment:"元亨，利贞，勿用有攸往，利建侯。",
        detail:{
          plain:"屯卦是“始生之难”。下震为动，上坎为险，动而遇险，如同幼苗破土时遭遇石块。但屯卦的“元亨”说明，这种困难是万物初生必经的阶段，本身蕴含着生长的力量。“勿用有攸往”不是永远不动，而是在根基未稳时不要贸然远行；“利建侯”则提示此时最该做的是建立根据地、寻找可依靠的力量、搭好结构。屯的核心智慧是：**开头难时，先建底盘，再图进取。**",
          career:"万事开头难，创业或新项目启动阶段阻力集中。不宜急于扩张，应先稳住基本盘、建立核心团队、明确方向。小心翼翼、观察时机、修心养性，比盲目突进更重要。",
          fortune:"身处困境，欲进难进。此时运势不在“攻”而在“守”与“建”。把困难视为必经的积累期，不因一时不顺而动摇。",
          family:"感情或家庭关系可能处于磨合初期，波折较多，双方都不容易妥协。需要给彼此时间建立信任和相处模式，不宜在根基未稳时做出重大承诺或变动。"
        }
      },
      { id:4, name:"蒙", symbol:"䷃", upper:"艮", lower:"坎",

        detail:{
          plain:"蒙卦象征启蒙与求知。下坎为险，上艮为止，内心有困惑而外有阻碍，正是需要学习的处境。“匪我求童蒙，童蒙求我”讲的是教与学的次序：求学者应当主动，教育者不应强灌。“初筮告，再三渎，渎则不告”则强调诚心与专注——第一次诚心发问，应当得到回应；反复轻慢地追问，反而得不到真正的答案。蒙卦的“亨”在于：承认自己的蒙昧，并以端正的态度求教，就能走向通达。",
          career:"初始阶段可能混乱无序、方向不明。此时最该做的是接受教育与训练，向有经验的人请教，而不是好高骛远或凭冲动行事。适合以学习者和成长者的姿态进入事业。",
          fortune:"初时迷惑，不知方向。运势的转折点不在外部机会，而在自身是否愿意放低姿态、耐心学习。听取长辈或有经验者的意见，会比独自摸索更有利。",
          family:"家庭或感情中可能存在沟通不畅、彼此不够理解的情况。需要以宽容和耐心代替指责，注重对方的品德与内在，而不是急于改变对方。"
        }
      },
      { id:5, name:"需", symbol:"䷄", upper:"坎", lower:"乾",
        judgment:"有孚，光亨，贞吉。利涉大川。",
        detail:{
          plain:"需卦是“等待”的智慧。下乾为健，上坎为险，内在有前进的动力，外部却有险阻，此时不能硬闯，而要“有孚”——以诚信和耐心等待时机。“光亨”说明这种等待不是消极的停滞，而是在等待中保持光明坦荡的心态。最终“利涉大川”，意味着当时机成熟，等待会转化为跨越险阻的力量。需卦的核心是：**等，不是什么都不做，而是在信心中积蓄，在耐心中观时。**",
          career:"不可轻举妄动。审时度势、保持冷静、积蓄实力，比仓促行动更重要。当前阶段适合做准备、建能力、观风向，不宜投机急取。",
          fortune:"运势处于“待时”阶段。冒险前进反而容易失利，耐心等待、大器晚成是更稳妥的路径。保持诚信与镇定，机会会在条件具备时出现。",
          family:"感情初期可能不如意或多有波折，不宜急于推进。耐心培养、逐步加深了解，比急于确定关系更有利于长久。"
        }
      },
      { id:6, name:"讼", symbol:"䷅", upper:"乾", lower:"坎",
        judgment:"有孚，窒。惕中吉。终凶。利见大人，不利涉大川。",
        detail:{
          plain:"讼卦讲争讼与冲突。下坎为险，上乾为刚，内心险诈而外呈刚强，容易陷入对立。“有孚，窒”是说即便自己占理，也可能被阻塞、难以伸张。“惕中吉”提示：在争执中保持警惕、适可而止，中途停下来反而吉祥；“终凶”则警告，把争讼进行到底，无论输赢都会付出代价。“利见大人”是请中正之人调停，“不利涉大川”是不要在冲突中再做冒险的大事。讼卦的核心是：**息争优于胜争。**",
          career:"起初可能顺利，继而容易受挫或卷入矛盾。退让、协调、借助公正的第三方化解分歧，比硬碰硬更有利。避免在冲突中做重大决策。",
          fortune:"百事不顺，事与愿违，容易遭遇口舌是非。以息事宁人为上策，保持警惕但不纠缠，防止小矛盾升级为持续损耗。",
          family:"家庭或感情中是非较多，反复不定，容易因言语起争执。需要温和协调、主动退让，避免在情绪中做出伤害关系的事。"
        }
      },
      { id:7, name:"师", symbol:"䷆", upper:"坤", lower:"坎",
        judgment:"贞，丈人，吉无咎。",
        detail:{
          plain:"师卦象征兵众、组织与行动中的纪律。下坎为险，上坤为顺，在危险中依靠顺理而行的组织力来解决问题。“贞”是守正，“丈人”指有威望、有经验的领导者。师卦的“吉无咎”不是轻易得来的——它要求行动有正当理由、领导者有德有能、组织有纪律有章法。师卦的核心是：**集体行动的力量来自纪律与正当性，而非单纯的人数或声势。**",
          career:"阻力较大，不宜独断专行或盲目冒险。需要与他人密切合作，谨小慎微，不贪功，依靠组织和纪律来推进。领导者的品德与经验是关键。",
          fortune:"运势处于需要“聚众成事”的阶段。忌单打独斗，也忌内部不和。提防潜在的对立因素，以正立身、以纪律约束，才能化险为夷。",
          family:"家庭中需要明确的秩序与分工，但也容易因角色不清或内外压力产生不和。以柔顺的态度沟通，同时守住原则，比情绪化对抗更有效。"
        }
      },
      { id:8, name:"比", symbol:"䷇", upper:"坎", lower:"坤",
        judgment:"吉。原筮元永贞，无咎。不宁方来，后夫凶。",
        detail:{
          plain:"比卦讲亲附与结盟。下坤上坎，水在地上，彼此相依。比卦的“吉”建立在“元永贞”之上：亲附必须有正当的开端、可长久的诚意和端正的原则。“不宁方来”是说四方不安定者纷纷前来依附，“后夫凶”则警告：该亲附的时候迟疑不来，会错失时机而陷入不利。比卦的核心是：**好的关系不是临时抱佛脚，而是在平时就以正道建立起来的相互依附。**",
          career:"有亲密的伙伴相助，相互扶持则事业可成。关键在于择友与择盟——与贤良者合作会带来助力，与不当之人绑定则会拖累。",
          fortune:"运势适合“与人相亲”，合作、结盟、融入团队会比孤立行动更顺。时机上宜速决，不可迟疑拖延。",
          family:"感情与家庭关系以彼此忠诚、相互依附为吉。两情相悦、互敬互谅是良好基础；但也要注意亲附的对象是否端正，不可因一时热情而忽视根本。"
        }
      },
      { id:9, name:"小畜", symbol:"䷈", upper:"巽", lower:"乾",
        judgment:"亨。密云不雨，自我西郊。",
        detail:{
          plain:"小畜卦是“以小蓄大”的状态。下乾为健，上巽为顺，内在有力量，外部却只能以柔顺的方式稍加约束。“密云不雨”是极精妙的意象：云已经聚集，但雨还没有落下——条件在酝酿，却尚未到释放的时候。“自我西郊”提示这种蓄积尚在自己的范围内，未及远施。小畜的“亨”在于：接受“小”的阶段，以耐心和节制蓄养实力，不强求立即兑现。",

            </button>
          </div>
        </div>

    // ============================================================
    // 应用主组件
    // ============================================================
    function App() {
      const [current, setCurrent] = useState(null);
      const [expanded, setExpanded] = useState(false);

      const drawRandom = useCallback(() => {
        const idx = Math.floor(Math.random() * GUA_DATA.length);
        setCurrent(GUA_DATA[idx]);
        setExpanded(false);
      }, []);

      const toggleExpand = useCallback(() => {
        setExpanded(v => !v);
      }, []);

      return (
        <div className="w-full max-w-lg mx-auto">
          <header className="text-center mb-10">
            <h1 className="text-3xl font-bold text-stone-800 tracking-widest">周易六十四卦</h1>

            <button
              onClick={drawRandom}
              className="px-8 py-3 bg-stone-800 text-white rounded-full text-sm tracking-widest

                         shadow-lg shadow-stone-300"
            >
              随 机 起 卦
            </button>
          </div>

          {current ? (
            <div
              className="fade-in bg-white rounded-2xl shadow-xl shadow-stone-200/60 p-8 border border-stone-100 card-clickable"
              onClick={toggleExpand}
              role="button"
              tabIndex={0}
              onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleExpand(); } }}
            >
              <div className="flex items-baseline justify-between mb-1">
                <span className="text-xs text-stone-400 tracking-widest">第 {current.id} 卦</span>
                <span className="text-xs text-stone-400 tracking-widest">
                  {current.upper}上 · {current.lower}下
                </span>
              </div>
              <h2 className="text-2xl font-bold text-stone-800 mb-1">{current.name}卦</h2>

              <div className="hexagram-symbol text-stone-700 text-center my-6 select-none">
                {current.symbol}
              </div>

              <div className="border-t border-stone-100 pt-5">
                <p className="text-xs text-stone-400 tracking-widest mb-2">卦 辞</p>
                <p className="text-stone-700 leading-relaxed text-base text-justify">
                  {current.judgment}
                </p>
              </div>

              {/* 未展开时的小提示 */}
              {!expanded && (
                <p className="text-center text-xs text-stone-300 tracking-widest mt-5">

            <p>卦辞底本：《周易正义》（公有领域）</p>
            <p className="mt-1">多维解读参考公开易学资料整理，示范卦已标注出处</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
